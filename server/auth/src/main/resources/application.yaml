server:
  port: 8081

spring:
  application:
    name: auth-service
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:cinematic-jwt-secret-key-cinematic-jwt-secret-key-cinematic-jwt-secret-key-cinematic-jwt-secret-key}
  expiration-ms: 3600000